name: Build, Lint & Publish
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/check.yml'
      - 'biome.json'
      - 'bun.lock'
      - 'bunfig.toml'
      - 'commitlint.config.js'
      - 'deno.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'src/**'
      - 'tests/**'
      - 'tsconfig.json'
  pull_request:
    paths:
      - '.github/workflows/check.yml'
      - 'biome.json'
      - 'bun.lock'
      - 'bunfig.toml'
      - 'commitlint.config.js'
      - 'deno.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'src/**'
      - 'tests/**'
      - 'tsconfig.json'

permissions:
  contents: read

jobs:
  linter:
    runs-on: ubuntu-latest

    steps:
      - name: check out code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          persist-credentials: false

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
        env:
          HUSKY: 0

      - name: Run Biome
        run: bun run check
        id: biome

      - name: Build package
        run: bun run build

      - name: Typecheck test contracts
        run: bun x tsc --noEmit --project tests/tsconfig.json

      - name: Publish in pkg.pr.new
        run: bunx pkg-pr-new publish
        if: github.repository == 'tiramisulabs/seyfert'

  test:
    name: Test (${{ matrix.runtime }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        runtime: [node, bun, deno]

    steps:
      - name: check out code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          persist-credentials: false

      # --- Node and shared pnpm install ---
      - name: Install Node
        if: matrix.runtime != 'bun'
        uses: actions/setup-node@v7
        with:
          node-version: '22.x'

      - name: Install pnpm
        if: matrix.runtime != 'bun'
        uses: pnpm/action-setup@v6

      - name: Install dependencies (Node and Deno)
        if: matrix.runtime != 'bun'
        run: pnpm install --frozen-lockfile

      - name: Test suites (Node)
        if: matrix.runtime == 'node'
        run: pnpm exec vitest run --config ./tests/vitest.config.mts ./tests/

      - name: Run Bot (Node)
        if: matrix.runtime == 'node' && env.BOT_TOKEN != ''
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: node ./tests/bot.js

      # --- Bun ---
      - name: Install Bun
        if: matrix.runtime == 'bun'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies (Bun)
        if: matrix.runtime == 'bun'
        run: bun install --frozen-lockfile --ignore-scripts
        env:
          HUSKY: 0

      - name: Build (Bun)
        if: matrix.runtime == 'bun'
        run: bun run build

      - name: Test suites (Bun)
        if: matrix.runtime == 'bun'
        run: bun --bun ./node_modules/vitest/vitest.mjs run --config ./tests/vitest.config.mts ./tests/

      # --- Deno ---
      - name: Install Deno
        if: matrix.runtime == 'deno'
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Build (Deno)
        if: matrix.runtime == 'deno'
        run: deno run -A npm:typescript/tsc --outDir ./lib

      - name: Test suites (Deno)
        if: matrix.runtime == 'deno'
        run: deno run -A npm:vitest run --config ./tests/vitest.config.mts ./tests/
