name: Build, Lint, Format & Publish
on:
  push:
    paths:
      - '.github/workflows/check.yml'
      - 'bunfig.toml'
      - 'deno.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'src/**'
      - 'tests/**'
      - 'tsconfig.json'
  pull_request:
    paths:
      - '.github/workflows/check.yml'
      - 'bunfig.toml'
      - 'deno.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'src/**'
      - 'tests/**'
      - 'tsconfig.json'

permissions:
  contents: read

jobs:
  linter:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: check out code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          registry-url: 'https://registry.npmjs.org'

      - uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Biome
        run: pnpm run check
        id: biome

      - name: Commit and Push changes
        continue-on-error: true
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff-index --quiet HEAD; then
            git commit -m "chore: apply formatting"
            git push origin HEAD:${{ github.ref }}
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HUSKY: 0

      - name: Run Bot
        id: bot-up
        if: env.BOT_TOKEN != ''
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: node ./tests/bot.js

      - name: Publish in pkg.pr.new
        run: pnpx pkg-pr-new publish
        if: github.repository == 'tiramisulabs/seyfert'

  test:
    name: Test (${{ matrix.runtime }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        runtime: [node, bun, deno]

    steps:
      - name: check out code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      # --- Node and shared pnpm install ---
      - name: Install Node
        if: matrix.runtime != 'bun'
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Install pnpm
        if: matrix.runtime != 'bun'
        uses: pnpm/action-setup@v4

      - name: Install dependencies (Node and Deno)
        if: matrix.runtime != 'bun'
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        if: matrix.runtime == 'node'
        run: pnpm run test:types

      - name: Test suites (Node)
        if: matrix.runtime == 'node'
        run: pnpm exec vitest run --config ./tests/vitest.config.mts ./tests/

      # --- Bun ---
      - name: Install Bun
        if: matrix.runtime == 'bun'
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies (Bun)
        if: matrix.runtime == 'bun'
        run: bun install --ignore-scripts
        env:
          HUSKY: 0

      - name: Build (Bun)
        if: matrix.runtime == 'bun'
        run: bun run build

      - name: Test suites (Bun)
        if: matrix.runtime == 'bun'
        run: bun --bun ./node_modules/vitest/vitest.mjs run --config ./tests/vitest.config.mts ./tests/

      # --- Deno ---
      - name: Install Deno
        if: matrix.runtime == 'deno'
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Build (Deno)
        if: matrix.runtime == 'deno'
        run: deno run --node-modules-dir=manual -A npm:typescript/tsc --outDir ./lib

      - name: Test suites (Deno)
        if: matrix.runtime == 'deno'
        run: deno run --node-modules-dir=manual -A npm:vitest run --config ./tests/vitest.config.mts ./tests/
