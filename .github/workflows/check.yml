name: Build, Lint & Publish
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/**/*.md'
      - '.github/**/*.yml'
      - '.github/**/*.yaml'
      - '.changeset/README.md'
      - 'AGENTS.md'
      - 'README.md'
      - 'biome.json'
      - 'bun.lock'
      - 'bunfig.toml'
      - 'commitlint.config.js'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'src/**'
      - 'tests/**'
      - 'tsconfig.json'
  pull_request:
    paths:
      - '.github/**/*.md'
      - '.github/**/*.yml'
      - '.github/**/*.yaml'
      - '.changeset/README.md'
      - 'AGENTS.md'
      - 'README.md'
      - 'biome.json'
      - 'bun.lock'
      - 'bunfig.toml'
      - 'commitlint.config.js'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'src/**'
      - 'tests/**'
      - 'tsconfig.json'

permissions:
  contents: read

jobs:
  tooling:
    name: Tooling & Test (Bun)
    runs-on: ubuntu-latest

    steps:
      - name: check out code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          persist-credentials: false

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
        env:
          HUSKY: 0

      - name: Run Biome
        run: bun run check
        id: biome

      - name: Build package
        run: bun run build

      - name: Typecheck test contracts
        run: |
          bun check --no-script --project tests/tsconfig.json
          bun check --no-script --project tests/exact-optional-tsconfig.json

      - name: Publish in pkg.pr.new
        run: bunx pkg-pr-new publish
        if: github.repository == 'tiramisulabs/seyfert'

      - name: Test suites
        run: bun --bun ./node_modules/vitest/vitest.mjs run --config ./tests/vitest.config.mts ./tests/

  test:
    name: Test (node)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: check out code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          persist-credentials: false

      # --- Node and pnpm install ---
      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: '26.12.1'

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test suites (Node)
        run: pnpm exec vitest run --config ./tests/vitest.config.mts ./tests/

      - name: Run Bot (Node)
        if: env.BOT_TOKEN != ''
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: node ./tests/bot.js
