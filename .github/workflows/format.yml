name: Format pull requests

on:
  pull_request:
    paths:
      - '.github/workflows/format.yml'
      - 'biome.json'
      - 'commitlint.config.js'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'src/**'
      - 'tests/**'
      - 'tsconfig.json'

permissions:
  actions: write
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    steps:
      - name: Check out pull request branch
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply Biome fixes
        run: pnpm run check:write

      - name: Commit and push changes
        id: format_commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff-index --quiet HEAD; then
            git commit -m "chore: apply formatting"
            git push origin "HEAD:${PR_HEAD_REF}"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          HUSKY: 0
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}

      - name: Run checks for formatted head
        if: steps.format_commit.outputs.changed == 'true'
        run: gh workflow run check.yml --ref "$PR_HEAD_REF"
        env:
          GH_TOKEN: ${{ github.token }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
